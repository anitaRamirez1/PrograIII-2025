<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>UROMED - Iniciar Sesión</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f0fdf4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background-color: white;
            border: 2px solid #4CAF50;
            border-radius: 8px;
            padding: 30px 40px;
            width: 400px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .logo {
            font-size: 1.5em;
            font-weight: bold;
            color: #4CAF50;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #2e7d32;
            font-size: 1em;
            margin-bottom: 20px;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        label {
            display: block;
            text-align: left;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #388E3C;
        }

        a {
            display: block;
            margin-top: 15px;
            color: #2e7d32;
            text-decoration: none;
            font-size: 0.9em;
        }

        /* Modal styles */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.4);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .modal-contenido {
            background-color: #fff;
            padding: 20px 30px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            position: relative;
            max-width: 300px;
        }

        .modal-contenido p {
            margin-bottom: 20px;
            font-size: 16px;
            color: #c62828;
        }

        .modal-contenido button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        .modal-contenido button:hover {
            background-color: #388E3C;
        }

        .cerrar {
            position: absolute;
            top: 8px;
            right: 12px;
            font-size: 20px;
            cursor: pointer;
            color: #888;
        }

        /* Mensaje de cuenta desactivada */
        .mensaje-desactivado {
            background-color: #fff3cd;
            color: #856404;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid #ffeaa7;
            font-size: 0.95em;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">UROMED</div>
        <div class="subtitle">Medico IA</div>
        <h2>INICIAR SESIÓN</h2>

        <!-- ✅ Mensaje para cuenta desactivada -->
        {% if mensaje_desactivado %}
        <div class="mensaje-desactivado">
            ⚠️ {{ mensaje_desactivado }}
        </div>
        {% endif %}

        <form action="{{ url_for('acceder') }}" method="POST">
            <label>Nombre de usuario:</label>
            <input type="text" name="username" required>

            <label>Contraseña:</label>
            <input type="password" name="password" required>

            <label>Rol:</label>
            <select name="rol" required>
                <option value="">Seleccione su rol</option>
                <option value="Super Administrador">Super Administrador</option>
                <option value="doctor">Doctor</option>
                <option value="enfermero">Enfermer@</option>
                <option value="asistente">Asistente</option>
            </select>

            <button type="submit">ACCEDER</button>
        </form>

        <a href="{{ url_for('registro') }}">¿No tienes cuenta? Haz clic Aquí</a>
        <a href="{{ url_for('recuperar_contrasena') }}">¿Olvidaste tu contraseña? Haz clic aquí</a>
    </div>

    <!-- Modal de error -->
    <div id="modal-error" class="modal">
        <div class="modal-contenido">
            <span class="cerrar" onclick="cerrarModal()">×</span>
            <p>❌ Credenciales incorrectas en el inicio de sesión.</p>
            <button onclick="cerrarModal()">OK</button>
        </div>
    </div>

    <script>
        function cerrarModal() {
            document.getElementById("modal-error").style.display = "none";
        }

        // Mostrar el modal si hay error
        {% if error %}
            document.getElementById("modal-error").style.display = "flex";
        {% endif %}
    </script>
</body>
</html>
