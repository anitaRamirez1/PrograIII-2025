<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Restablecer Contraseña - UROMED</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f0fdf4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .restablecer-container {
            background-color: white;
            border: 2px solid #4CAF50;
            border-radius: 8px;
            padding: 30px 40px;
            width: 400px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            color: #4CAF50;
            margin-bottom: 10px;
            font-size: 2em;
        }

        h2 {
            margin-bottom: 20px;
            color: #2e7d32;
            font-size: 1.3em;
        }

        label {
            display: block;
            text-align: left;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1em;
        }

        input:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #388E3C;
        }

        a {
            display: block;
            margin-top: 15px;
            color: #2e7d32;
            text-decoration: none;
            font-size: 0.9em;
        }

        a:hover {
            text-decoration: underline;
        }

        .error {
            background-color: #ffebee;
            color: #c62828;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            border: 1px solid #ef9a9a;
        }

        .info {
            background-color: #e8f5e9;
            color: #2e7d32;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            border: 1px solid #a5d6a7;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="restablecer-container">
        <h1>UROMED</h1>
        <h2>Restablecer Contraseña</h2>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <div class="info">
            Ingresa tu nueva contraseña (mínimo 6 caracteres)
        </div>

        <form method="POST" action="">
            <label for="nueva">Nueva contraseña:</label>
            <input type="password" name="nueva" id="nueva" required>

            <label for="confirmar">Confirmar contraseña:</label>
            <input type="password" name="confirmar" id="confirmar" required>

            <button type="submit">Restablecer</button>
        </form>

        <a href="{{ url_for('login') }}">Volver al inicio de sesión</a>
    </div>
</body>
</html>
