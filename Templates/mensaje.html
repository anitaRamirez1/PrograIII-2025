<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mensaje - UROMED</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .mensaje-box {
            background-color: white;
            padding: 30px 40px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            border-left: 6px solid #2e7d32;
        }

        .mensaje-box h2 {
            color: #2e7d32;
            margin-bottom: 20px;
        }

        .mensaje-box p {
            font-size: 1em;
            color: #333;
            margin-bottom: 25px;
        }

        .mensaje-box a {
            display: inline-block;
            padding: 10px 20px;
            background-color: #2e7d32;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .mensaje-box a:hover {
            background-color: #1b5e20;
        }
    </style>
</head>
<body>
    <div class="mensaje-box">
        <h2>UROMED</h2>
        <p>{{ mensaje }}</p>
        <a href="{{ url_for('login') }}">Volver al inicio de sesión</a>
    </div>
</body>
</html>
